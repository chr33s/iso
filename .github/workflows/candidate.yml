name: Release candidate

on:
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    if: github.repository == 'chr33s/iso' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml

  candidate:
    needs: ci
    runs-on: xcode-27
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned mise.toml tools (Swift, Python). No cache: a cache written by
      # another workflow run must not feed a release build.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.3
          cache: false

      - name: Build, test, sign, and notarize same-revision Swift candidate
        env:
          REVISION: ${{ github.sha }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          python3 scripts/build-release.py --release --test --sign \
            --expected-revision "$REVISION" --out "$RUNNER_TEMP/candidate"
          echo "TARBALL=$(ls "$RUNNER_TEMP"/candidate/iso-*-aarch64-apple-darwin.tar.gz)" >> "$GITHUB_ENV"

      - name: Check archive contents and signatures
        run: |
          mkdir "$RUNNER_TEMP/iso-candidate"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/iso-candidate"
          cd "$RUNNER_TEMP"/iso-candidate/iso-*-aarch64-apple-darwin
          for binary in iso iso-proxy iso-egress iso-sandbox; do
            test -x "$binary"
            test "$(shasum -a 256 "$binary" | cut -d' ' -f1)" = "$(jq -r ".binaries[\"$binary\"]" BUILD.json)"
            codesign --verify --strict "$binary"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$binary"
          done
          jq -e '.release_build and .developer_id_signed and .tested and (.source_dirty | not)' BUILD.json
          ./iso --version
          ./iso-sandbox version

      - name: Attest candidate archive
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.TARBALL }}

      - name: Prepare verification files
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cd "$RUNNER_TEMP/candidate"
          shasum -a 256 -c SHA256SUMS
          jq -c . "$BUNDLE_PATH" > "$RUNNER_TEMP/attestations.jsonl"
          test -s "$RUNNER_TEMP/attestations.jsonl"

      # This is an opt-in candidate artifact. It does not publish a release,
      # or change the stable install/update channel.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iso-candidate-${{ github.sha }}-aarch64-apple-darwin
          path: |
            ${{ env.TARBALL }}
            ${{ runner.temp }}/candidate/SHA256SUMS
            ${{ runner.temp }}/attestations.jsonl
