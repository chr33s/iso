name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  CARGO_TERM_COLOR: always
  BINARY: coop

jobs:
  source:
    if: github.repository == 'chr33s/coop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a release commit from swift
        run: git merge-base --is-ancestor HEAD origin/swift

  ci:
    needs: source
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml

  build:
    needs: ci
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: xcode-27
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        shell: bash
        run: |
          features=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            features=(--features apple-container)
          fi
          cargo build --release --workspace --target "${{ matrix.target }}" "${features[@]}"

      - name: Build Swift proxy (macOS 27+)
        if: runner.os == 'macOS'
        run: |
          swift build --package-path coop-proxy -c release --force-resolved-versions
          proxy_dir="$(swift build --package-path coop-proxy -c release --show-bin-path)"
          cp "$proxy_dir/coop-proxy-swift" "target/${{ matrix.target }}/release/coop-proxy"
          codesign --verify --strict "target/${{ matrix.target }}/release/coop-proxy"

      - name: Build and sign Apple runtime
        if: runner.os == 'macOS'
        run: |
          scripts/build-coop-sandbox.sh "$RUNNER_TEMP/coop-runtime"
          cp "$RUNNER_TEMP/coop-runtime/bin/coop-sandbox" "target/${{ matrix.target }}/release/coop-sandbox"
          codesign --verify --strict "target/${{ matrix.target }}/release/coop-sandbox"

      - name: Verify release binaries
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          expected="coop ${TAG#v} ($(git rev-parse --short HEAD))"
          actual="$("target/${TARGET}/release/coop" --version)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Expected release version %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          fi
          if [[ "$TARGET" == *apple-darwin ]]; then
            test -x "target/${TARGET}/release/coop-proxy"
            "target/${TARGET}/release/coop-sandbox" version
          fi

      - name: Package
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="${BINARY}-${tag}-${{ matrix.target }}"
          mkdir -p "staging/${name}"
          cp "target/${{ matrix.target }}/release/${BINARY}" "staging/${name}/"
          if [[ "$RUNNER_OS" == macOS ]]; then
            cp "target/${{ matrix.target }}/release/coop-proxy" "staging/${name}/"
            cp "target/${{ matrix.target }}/release/coop-sandbox" "staging/${name}/"
          fi
          cp LICENSE* "staging/${name}/" 2>/dev/null || true
          tar -czf "${name}.tar.gz" -C staging "${name}"
          echo "TARBALL=${name}.tar.gz" >> "$GITHUB_ENV"

      # macOS archives go to `sign-macos` first; only `dist-*` is published.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ runner.os == 'macOS' && 'unsigned' || 'dist' }}-${{ matrix.target }}
          path: ${{ env.TARBALL }}

  # Developer ID signing and notarization, so Gatekeeper runs a downloaded copy
  # without `xattr -d com.apple.quarantine`. A separate job that never builds
  # or runs repository code other than the signing script, so the signing
  # secrets are not exposed to build scripts or dependencies.
  sign-macos:
    needs: build
    runs-on: xcode-27
    environment: release
    permissions:
      contents: read
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/macos-sign-notarize.sh
            coop-sandbox/coop-sandbox.entitlements
          sparse-checkout-cone-mode: false

      - name: Download unsigned archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-${{ env.TARGET }}

      - name: Sign and notarize
        env:
          TAG: ${{ github.ref_name }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          name="${BINARY}-${TAG}-${TARGET}"
          mkdir staging
          tar -xzf "${name}.tar.gz" -C staging
          rm "${name}.tar.gz"
          scripts/macos-sign-notarize.sh "staging/${name}"
          "staging/${name}/coop" --version
          "staging/${name}/coop-sandbox" version
          COPYFILE_DISABLE=1 tar -czf "${name}.tar.gz" -C staging "${name}"
          echo "TARBALL=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload signed archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ env.TARGET }}
          path: ${{ env.TARBALL }}

  release:
    needs: [build, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum coop-*.tar.gz > SHA256SUMS

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "coop-*.tar.gz"

      # The asset name is load-bearing: `gh attestation verify --bundle`
      # dispatches on the file extension and rejects anything that is not
      # `.json`/`.jsonl`, so renaming this output breaks verification for every
      # client. `bundle-path` is a single JSON line covering all three tarball
      # subjects, so `jq -c` reshapes nothing — it is here to reject a malformed
      # bundle, and the `-s` test to reject an empty one, which `jq` itself
      # exits 0 on.
      #
      # An empty asset is caught client-side too (`install.sh` gates on `[ -s ]`
      # and `resolve_provenance` returns `ApiReason::EmptyBundle`, both falling
      # back to the API). What no client catches is a *non-empty* degenerate
      # bundle: a whitespace-only file passes `[ -s ]` and `len() > 0` alike,
      # and `gh`'s JSON-Lines loader then yields zero attestations — which `gh`
      # before 2.56.0 (cli/cli#9541) reports as success, having verified
      # nothing. `jq -c .` is what makes that unreachable, so it has to stay
      # upstream of publication; the tag is immutable once cut.
      - name: Normalize attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          jq -c . "$BUNDLE_PATH" > attestations.jsonl
          if [ ! -s attestations.jsonl ]; then
            echo "Attestation bundle at $BUNDLE_PATH produced no output" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="## $TAG" '
            $0 == tag { found=1; next }
            found && /^## / { exit }
            found
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG entry found for $TAG" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md coop-*.tar.gz SHA256SUMS attestations.jsonl
