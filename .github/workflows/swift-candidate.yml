name: Swift release candidate

on:
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    if: github.repository == 'chr33s/coop' && github.ref == 'refs/heads/swift'
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml

  candidate:
    needs: ci
    runs-on: xcode-27
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test candidate builder
        run: python3 tests/test-proxy-transition-build.py

      # The builder strips the signing secrets from every cargo/swift
      # subprocess; only scripts/macos-sign-notarize.sh receives them.
      - name: Build, sign, and notarize same-revision Apple transition candidate
        env:
          REVISION: ${{ github.sha }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          python3 scripts/build-proxy-transition.py --release --include-runtime --sign \
            --expected-revision "$REVISION" \
            --archive "$RUNNER_TEMP/coop-proxy-transition-${REVISION}-aarch64-apple-darwin.tar.gz"
          echo "TARBALL=$RUNNER_TEMP/coop-proxy-transition-${REVISION}-aarch64-apple-darwin.tar.gz" >> "$GITHUB_ENV"

      - name: Check archive contents and signatures
        run: |
          mkdir "$RUNNER_TEMP/proxy-candidate"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/proxy-candidate"
          cd "$RUNNER_TEMP/proxy-candidate/coop-proxy-transition"
          shasum -a 256 -c SHA256SUMS
          for binary in coop coop-proxy coop-sandbox; do
            test -x "$binary"
            codesign --verify --strict "$binary"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$binary"
          done
          ./coop --version
          ./coop-sandbox version

      - name: Attest candidate archive
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.TARBALL }}

      - name: Prepare verification files
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cd "$RUNNER_TEMP"
          shasum -a 256 "$(basename "$TARBALL")" > SHA256SUMS
          jq -c . "$BUNDLE_PATH" > attestations.jsonl
          test -s attestations.jsonl

      # This is an opt-in candidate artifact. It does not publish a release,
      # or change the stable install/update channel.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxy-transition-${{ github.sha }}-aarch64-apple-darwin
          path: |
            ${{ env.TARBALL }}
            ${{ runner.temp }}/SHA256SUMS
            ${{ runner.temp }}/attestations.jsonl
