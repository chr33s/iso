name: Nightly

# Gates too slow for every push: the host tests under each sanitizer and the
# fault-injection check (docs/testing.md).
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # A scheduled run is skipped when nothing but docs changed since the last
  # one (26 h, so a late cron start does not skip a day); a manual run
  # always proceeds.
  changes:
    name: Code changed since the last nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Look for code commits in the last 26 hours
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != schedule ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commits="$(git log --since="26 hours ago" --format=%H -- . ':(exclude)docs/**' ':(exclude)*.md')"
          if [[ -n "$commits" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No code commits in the last 26 hours; skipping the nightly gates." >> "$GITHUB_STEP_SUMMARY"
          fi

  sanitizers:
    name: Host tests (${{ matrix.sanitizer }} sanitizer)
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread, undefined]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.7

      - name: Host tests under the ${{ matrix.sanitizer }} sanitizer
        shell: bash
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          extra=()
          # Swift Build does not link the UBSan runtime that the C
          # dependencies' instrumentation needs (docs/testing.md).
          if [[ "$SANITIZER" == undefined ]]; then
            extra=(-Xlinker "$(xcrun clang --print-runtime-dir)/libclang_rt.ubsan_osx_dynamic.dylib")
          fi
          swift test --sanitize="$SANITIZER" --scratch-path ".build-$SANITIZER" \
            --force-resolved-versions ${extra[@]+"${extra[@]}"}

  # One runner takes over two hours for the whole fault list, so it is split
  # into shards that together cover every fault.
  fault-injection:
    name: Host fault injection (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.7

      - name: Tests detect every injected fault in this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/swift-host-fault-injection.py --shard "$SHARD/4"

  proxy-mutations:
    name: Credential proxy mutations
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.7

      - name: Proxy tests kill every policy and parser-limit mutation
        run: python3 scripts/test-swift-proxy-mutations.py
