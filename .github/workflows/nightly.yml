name: Nightly

# Gates too slow for every push: the host tests under each sanitizer and the
# fault-injection check (docs/testing.md).
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # A scheduled run is skipped when nothing but docs changed between the
  # commit of the last successful nightly on main and this one; a manual run
  # always proceeds. Comparing trees, not commit dates, covers commits pushed
  # long after they were made and merges of older branches, and a failed run
  # is retried every night until one passes.
  changes:
    name: Code changed since the last nightly success
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # Find the last successful run of this workflow.
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compare with the last successful nightly
        id: check
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$EVENT" != schedule ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(gh api "repos/$REPO/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')" || last=""
          if [[ ! "$last" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$last^{commit}" 2> /dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No usable last successful nightly; running the nightly gates." >> "$GITHUB_STEP_SUMMARY"
          elif git diff --quiet "$last" HEAD -- . ':(exclude)docs/**' ':(exclude)*.md'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing but docs changed since the last successful nightly (${last::12}); skipping the nightly gates." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  sanitizers:
    name: Host tests (${{ matrix.sanitizer }} sanitizer)
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread, undefined]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9

      - name: Host tests under the ${{ matrix.sanitizer }} sanitizer
        shell: bash
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          extra=()
          # Swift Build does not link the UBSan runtime that the C
          # dependencies' instrumentation needs (docs/testing.md).
          if [[ "$SANITIZER" == undefined ]]; then
            extra=(-Xlinker "$(xcrun clang --print-runtime-dir)/libclang_rt.ubsan_osx_dynamic.dylib")
          fi
          swift test --sanitize="$SANITIZER" --scratch-path ".build-$SANITIZER" \
            --force-resolved-versions ${extra[@]+"${extra[@]}"}

  # One runner takes over two hours for the whole fault list, so it is split
  # into shards that together cover every fault.
  fault-injection:
    name: Host fault injection (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9

      - name: Tests detect every injected fault in this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/swift-host-fault-injection.py --shard "$SHARD/4"

  proxy-mutations:
    name: Credential proxy mutations
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9

      - name: Proxy tests kill every policy and parser-limit mutation
        run: python3 scripts/test-swift-proxy-mutations.py
