name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels its superseded run. Branch pushes and release or
# candidate calls (a distinct caller workflow) always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Swift host (root package, product `iso`) and the Apple runtime.
  # Release calls this workflow, so these jobs also gate release builds.
  check:
    name: Host and runtime
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tools pinned in mise.toml (Swift, Python, yq, actionlint, ...), the same
      # ones the pre-commit hook uses. Xcode supplies the macOS SDK and codesign.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.3

      # The pre-commit gates (mise.toml `check`) over every tracked file.
      - name: Hygiene, format, build, and tests
        shell: bash
        run: |
          python3 scripts/hygiene.py --all
          mise run lint
          mise run build
          mise run test
          git diff --exit-code -- Package.resolved

      - name: Workflow lint
        run: actionlint

      # The inventory checks references to the removed Rust host at its recorded
      # baseline commit, which the shallow checkout does not include.
      - name: Configuration migration and compatibility inventory tests
        run: |
          baseline=$(python3 -c 'import json; print(json.load(open("docs/design/swift-host-inventory.json"))["baseline_revision"])')
          git fetch --no-tags --depth=1 origin "$baseline"
          python3 tests/test-migrate-config.py
          python3 tests/test-inference-launcher.py
          python3 tests/test-swift-host-inventory.py

      # Replays the results recorded from the baseline host before its removal.
      - name: Command, lifecycle, data-root and CLI-surface baselines
        run: |
          python3 tests/test-swift-host-read-parity.py --golden tests/baseline/parity/read.json --swift .build/debug/iso
          python3 tests/test-swift-host-lifecycle-parity.py --golden tests/baseline/parity/lifecycle.json --swift .build/debug/iso
          python3 tests/test-swift-host-data-root-parity.py --golden tests/baseline/parity/data-root.json --swift .build/debug/iso
          python3 tests/test-swift-host-cli-surface.py --swift .build/debug/iso

      - name: Release preflight regression tests
        run: python3 tests/test-preflight-release.py

      - name: Proxy runner and fixture regression tests
        run: |
          python3 tests/test-proxy-vm-fixture.py
          python3 tests/test-proxy-live.py
          python3 tests/test-proxy-agent-smoke.py

      - name: Codex account wrapper regression tests
        run: python3 tests/test-codex-account.py

      - name: Integration test — installer provenance
        run: ./tests/integration-install.sh

      - name: Integration test — iso update
        run: ./tests/integration-update.sh

      - name: Integration test — iso uninstall
        run: ./tests/integration-uninstall.sh

      - name: iso-sandbox format, build and unit tests
        run: |
          swift format lint --recursive --strict iso-sandbox/Package.swift iso-sandbox/Sources iso-sandbox/Tests
          swift test --package-path iso-sandbox --force-resolved-versions --no-parallel
          swift test --package-path iso-sandbox/Vendor/containerization --filter UnixSocketRelayTests

      # libFuzzer is built from the vendored, hash-checked fuzz/libfuzzer sources.
      - name: Fuzz corpus replay and bounded smoke
        shell: bash
        run: scripts/fuzz.sh smoke 30

  # The proxy intentionally targets macOS 27 system trust. macos-latest does
  # not guarantee that SDK/runtime; xcode-27 is GitHub's macOS 27 preview image.
  proxy:
    name: Credential proxy
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tools pinned in mise.toml (Swift, Python, yq, actionlint, ...), the same
      # ones the pre-commit hook uses. Xcode supplies the macOS SDK and codesign.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.3

      - name: Swift proxy format, unit, and confined-process gates
        shell: bash
        run: |
          ulimit -n 8192
          swift format lint --recursive --strict iso-proxy/Sources iso-proxy/Tests
          swift test --package-path iso-proxy --force-resolved-versions
          python3 scripts/test-swift-proxy-process.py --skip-tls

      - name: Inference gateway confined-process gate
        shell: bash
        run: |
          swift build --package-path iso-proxy --product iso-inference --force-resolved-versions
          python3 scripts/test-inference-gateway-process.py

      - name: Shared forwarding and disconnect corpus
        shell: bash
        run: |
          ulimit -n 8192
          python3 scripts/test-proxy-forwarding-corpus.py
          python3 scripts/test-proxy-upstream-disconnect.py

  zizmor:
    name: Workflow security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
