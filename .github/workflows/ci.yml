name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels its superseded run. Branch pushes and release or
# candidate calls (a distinct caller workflow) always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Swift host (root package, product `iso`) and the Apple runtime.
  # Release calls this workflow, so these jobs also gate release builds.
  check:
    name: Host and runtime
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tools pinned in mise.toml (Swift, Python, yq, jactionlint, ...), the same
      # ones the pre-commit hook uses. Xcode supplies the macOS SDK and codesign.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.9

      # The pre-commit gates (mise.toml `check`) over every tracked file.
      - name: Hygiene, format, build, and tests
        shell: bash
        run: |
          python3 scripts/hygiene.py --all
          mise run lint
          mise run build
          mise run test
          git diff --exit-code -- Package.resolved

      # The nightly fault-injection run edits these anchors; a stale one fails
      # the push that made it stale instead of the next nightly.
      - name: Fault-injection anchors
        run: python3 scripts/swift-host-fault-injection.py --check-anchors

      - name: IsoPolicy library tests
        run: mise run check-policy

      - name: Workflow lint
        run: jactionlint

      - name: Shell lint
        run: mise run lint-shell

      - name: Release legal notices
        run: |
          python3 tests/test-release-legal.py
          python3 tests/test-release-private-entitlements.py

      - name: Host behavior and CLI contracts
        run: |
          python3 tests/test-read-contract.py --swift .build/debug/iso
          python3 tests/test-lifecycle-contract.py --swift .build/debug/iso
          python3 tests/test-data-root-contract.py --swift .build/debug/iso
          python3 tests/test-machine-contract.py --swift .build/debug/iso
          python3 tests/test-audit-contract.py --swift .build/debug/iso
          python3 tests/test-cli-surface.py --swift .build/debug/iso

      - name: VM integration harness regression tests
        run: python3 tests/test-apple-integration-harness.py

      - name: Release preflight regression tests
        run: |
          python3 tests/test-preflight-release.py
          python3 tests/test-verify-candidate.py
          python3 tests/test-accept-release.py
          python3 tests/test-check-release-signatures.py

      - name: Proxy runner and fixture regression tests
        run: |
          python3 tests/test-proxy-vm-fixture.py
          python3 tests/test-proxy-live.py
          python3 tests/test-proxy-agent-smoke.py

      - name: Codex account wrapper regression tests
        run: python3 tests/test-codex-account.py

      - name: Integration test — installer provenance
        run: ./tests/integration-install.sh

      - name: Integration test — iso update
        run: ./tests/integration-update.sh

      - name: Integration test — iso uninstall
        run: ./tests/integration-uninstall.sh

      - name: SwiftPM pins unchanged
        run: git diff --exit-code -- '*Package.resolved'

  # Semgrep code-style rules (.semgrep/rules). Its own job so the PyPI install
  # runs in parallel with the Swift build; only its tools are installed. It
  # reads source text only, so it runs on Linux and leaves the macOS runners
  # to the jobs that build Swift (mise.lock pins python and uv for linux-x64).
  semgrep:
    name: Code-style rules
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.9
          install_args: python uv semgrep

      - name: Semgrep rule fixtures and scan
        run: mise run semgrep

  # Independent of the host job: each builds its own package, so they run in
  # parallel on separate runners. Release calls this workflow and needs all.
  sandbox:
    name: Apple runtime
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.9

      - name: iso-sandbox build and unit tests
        run: swift test --package-path iso-sandbox --force-resolved-versions --no-parallel

      - name: SwiftPM pins unchanged
        run: git diff --exit-code -- '*Package.resolved'

  egress:
    name: Filtered egress
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.9

      - name: Filtered-egress unit and confined lease gates
        run: mise run check-egress

      - name: SwiftPM pins unchanged
        run: git diff --exit-code -- '*Package.resolved'

  iso-ci:
    name: iso-ci companion
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.9

      # Fixture and unit tests only: no live GitHub, VM or runner qualification.
      - name: iso-ci companion build and tests
        run: mise run check-ci

      - name: SwiftPM pins unchanged
        run: git diff --exit-code -- '*Package.resolved'

  fuzz:
    name: Fuzz smoke
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.9

      # libFuzzer is built from the vendored, hash-checked fuzz/libfuzzer sources.
      - name: Fuzz corpus replay and bounded smoke
        shell: bash
        run: scripts/fuzz.sh smoke 30

  # The proxy intentionally targets macOS 27 system trust. macos-latest does
  # not guarantee that SDK/runtime; xcode-27 is GitHub's macOS 27 preview image.
  proxy:
    name: Credential proxy
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tools pinned in mise.toml (Swift, Python, yq, jactionlint, ...), the same
      # ones the pre-commit hook uses. Xcode supplies the macOS SDK and codesign.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.9

      - name: Swift proxy offline E2E gates
        shell: bash
        run: |
          ulimit -n 8192
          swift build --package-path iso-proxy --force-resolved-versions
          bin_dir="$(swift build --package-path iso-proxy --show-bin-path)"
          ISO_PROXY_E2E_BINARY="$bin_dir/iso-proxy" \
            swift test --package-path iso-proxy --force-resolved-versions
          python3 scripts/test-proxy-contract.py --swift "$bin_dir/iso-proxy"

      # The iso-inference gateway (built above, same package) under its Seatbelt
      # profile, and the host's managed-backend launcher against a stand-in
      # mlx_lm. The gateway's unit tests ran in the package tests above.
      - name: Inference gateway confined-process and launcher gates
        run: mise run check-inference

  zizmor:
    name: Workflow security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          version: 1.31.1 # Keep in sync with the mise.toml pin.
