name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels its superseded run. Branch pushes and release or
# candidate calls (a distinct caller workflow) always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Swift host (root package, product `iso`) and the Apple runtime.
  # Release calls this workflow, so these jobs also gate release builds.
  check:
    name: Host and runtime
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tools pinned in mise.toml (Swift, Python, yq, actionlint, ...), the same
      # ones the pre-commit hook uses. Xcode supplies the macOS SDK and codesign.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.3

      # The pre-commit gates (mise.toml `check`) over every tracked file.
      - name: Hygiene, format, build, and tests
        shell: bash
        run: |
          python3 scripts/hygiene.py --all
          mise run lint
          mise run build
          mise run test
          git diff --exit-code -- Package.resolved

      - name: Workflow lint
        run: actionlint

      - name: Release legal notices
        run: python3 tests/test-release-legal.py

      - name: Host behavior and CLI contracts
        run: |
          python3 tests/test-read-contract.py --swift .build/debug/iso
          python3 tests/test-lifecycle-contract.py --swift .build/debug/iso
          python3 tests/test-data-root-contract.py --swift .build/debug/iso
          python3 tests/test-cli-surface.py --swift .build/debug/iso

      - name: VM integration harness regression tests
        run: python3 tests/test-apple-integration-harness.py

      - name: Release preflight regression tests
        run: python3 tests/test-preflight-release.py

      - name: Proxy runner and fixture regression tests
        run: |
          python3 tests/test-proxy-vm-fixture.py
          python3 tests/test-proxy-live.py
          python3 tests/test-proxy-agent-smoke.py

      - name: Codex account wrapper regression tests
        run: python3 tests/test-codex-account.py

      - name: Integration test — installer provenance
        run: ./tests/integration-install.sh

      - name: Integration test — iso update
        run: ./tests/integration-update.sh

      - name: Integration test — iso uninstall
        run: ./tests/integration-uninstall.sh

      - name: iso-sandbox build and unit tests
        run: swift test --package-path iso-sandbox --force-resolved-versions --no-parallel

      - name: Filtered-egress unit and confined lease gates
        shell: bash
        run: |
          swift format lint --recursive --strict iso-egress/Package.swift iso-egress/Sources iso-egress/Tests scripts/verify-egress-readiness.swift
          swift test --package-path iso-egress --force-resolved-versions
          swift build --package-path iso-egress --force-resolved-versions
          python3 scripts/test-swift-egress-jail.py
          python3 scripts/test-swift-egress-lease.py
          python3 scripts/test-swift-egress-mutations.py

      # libFuzzer is built from the vendored, hash-checked fuzz/libfuzzer sources.
      - name: Fuzz corpus replay and bounded smoke
        shell: bash
        run: scripts/fuzz.sh smoke 30

  # The proxy intentionally targets macOS 27 system trust. macos-latest does
  # not guarantee that SDK/runtime; xcode-27 is GitHub's macOS 27 preview image.
  proxy:
    name: Credential proxy
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tools pinned in mise.toml (Swift, Python, yq, actionlint, ...), the same
      # ones the pre-commit hook uses. Xcode supplies the macOS SDK and codesign.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.3

      - name: Swift proxy format and offline E2E gates
        shell: bash
        run: |
          ulimit -n 8192
          swift format lint --recursive --strict iso-proxy/Sources iso-proxy/Tests
          swift build --package-path iso-proxy --force-resolved-versions
          bin_dir="$(swift build --package-path iso-proxy --show-bin-path)"
          ISO_PROXY_E2E_BINARY="$bin_dir/iso-proxy" \
            swift test --package-path iso-proxy --force-resolved-versions

  zizmor:
    name: Workflow security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
