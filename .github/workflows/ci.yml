name: CI

on:
  push:
    branches: [main, swift]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Release preflight regression tests
        run: |
          python3 tests/test-preflight-release.py
          python3 tests/test-proxy-transition-build.py

      - name: Integration probe regression tests
        run: |
          python3 tests/test-integration-probes.py
          python3 tests/test-proxy-vm-fixture.py
          python3 tests/test-proxy-live.py
          python3 tests/test-proxy-agent-smoke.py

      - name: Codex account wrapper regression tests
        run: python3 tests/test-codex-account.py

      - name: Integration test — installer provenance
        run: ./tests/integration-install.sh

      - name: Integration test — coop update
        run: ./tests/integration-update.sh

      - name: Integration test — coop uninstall
        run: ./tests/integration-uninstall.sh

      - name: coop-sandbox build and unit tests
        run: swift test --package-path coop-sandbox --force-resolved-versions --no-parallel

  # The proxy intentionally targets macOS 27 system trust. macos-latest does
  # not guarantee that SDK/runtime; xcode-27 is GitHub's macOS 27 preview image.
  # Release calls this workflow, so this job also gates release builds.
  swift-proxy:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Swift proxy format, unit, and confined-process gates
        shell: bash
        run: |
          ulimit -n 8192
          swift format lint --recursive --strict coop-proxy/Sources coop-proxy/Tests
          swift test --package-path coop-proxy --force-resolved-versions
          python3 scripts/test-swift-proxy-process.py --skip-tls

      - name: Shared forwarding and disconnect corpus
        shell: bash
        run: |
          ulimit -n 8192
          python3 scripts/test-proxy-forwarding-corpus.py
          python3 scripts/test-proxy-upstream-disconnect.py

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      # Pin to match CARGO_DENY_VERSION in scripts/install-dev-tools.sh so CI and
      # local installs run the same version.
      - name: Install cargo-deny
        run: cargo binstall --no-confirm cargo-deny@0.19.9

      - name: Check advisories, licenses, bans, sources
        run: cargo deny --workspace check

  taplo:
    runs-on: ubuntu-latest
    # Single version knob for this job; keep in sync with TAPLO_VERSION in
    # scripts/install-dev-tools.sh. Used for both the cache key and the install,
    # so the two can never drift (a bumped install with a stale key would
    # silently keep checking with the cached old binary).
    env:
      TAPLO_VERSION: 0.10.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # taplo has no cargo-binstall prebuilts, so compile from crates.io
      # (checksum-verified source) and cache the binary keyed on the pinned
      # version — only the first run or a version bump pays the compile cost.
      - name: Cache taplo
        id: cache-taplo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/taplo
          key: ${{ runner.os }}-taplo-cli-${{ env.TAPLO_VERSION }}

      - name: Install taplo
        if: steps.cache-taplo.outputs.cache-hit != 'true'
        run: cargo install taplo-cli --version "=${TAPLO_VERSION}" --locked

      - name: Check TOML formatting
        run: taplo format --check

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
