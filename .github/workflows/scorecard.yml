name: Scorecard

# OpenSSF Scorecard supply-chain checks (pinned actions, token permissions,
# branch protection, dangerous workflow patterns, ...). Results go to code
# scanning as SARIF and to the public Scorecard API (docs/testing.md).
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # scorecard-action is a Docker container action, so it needs a Linux
  # runner; nothing here builds or runs Swift, so xcode-27 is not needed.
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results: the Scorecard API verifies this run's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
