# Derived from trailofbits/coop.
# Modified by chr33s: ported/adapted for the Swift implementation.
# SPDX-License-Identifier: Apache-2.0

# Dependabot has no ecosystem for these pins; they are updated by hand:
#   - mise.toml tools (Swift, Python, uv, semgrep, linters, container) and
#     min_version. Regenerate mise.lock with
#     `mise lock --platform macos-arm64,linux-x64` after changing a pin.
#   - every workflow's jdx/mise-action `version:` input, which must read the
#     lockfile layout min_version names. Dependabot bumps the action's commit
#     pin only.
#   - .mise/locks/: generated by mise from its semgrep pin.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1

  # SwiftPM pins (Package.resolved) for the host, proxy, runtime and iso-ci
  # packages. iso-egress and iso-policy have no package dependencies; list a
  # package here when it gains one.
  - package-ecosystem: swift
    directories: ["/", "/iso-proxy", "/iso-sandbox", "/iso-ci"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      swift:
        patterns: ["*"]
    open-pull-requests-limit: 1

  # The website's build and deploy tooling (www/package-lock.json).
  - package-ecosystem: npm
    directory: /www
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      www:
        patterns: ["*"]
    open-pull-requests-limit: 1

  # The digest-pinned Ubuntu base of the desktop kernel's build image and the
  # VM-suite fixture image. The same digest is pinned in
  # Sources/IsoHost/Guest/ImageBuild.swift and tests/integration-apple-sandbox.sh,
  # which Dependabot does not edit: tests/test-preflight-release.py fails until
  # they agree. A new kernel build image also needs a rebuilt, re-pinned
  # kernel (KernelPin.desktopAllowed) before the next release.
  - package-ecosystem: docker
    directories: ["/iso-sandbox/kernel", "/tests/fixtures/apple-sandbox/image"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    open-pull-requests-limit: 1
