# Pinned development toolchain and git hooks for iso (https://mise.jdx.dev).
#
#   mise install                                   # install the pinned tools
#   mise generate git-pre-commit --write           # enable the pre-commit hook
#   mise run check                                 # everything the hook runs
#
# Xcode 27 is still required: it supplies the macOS 27 SDK, `codesign`, and
# the Virtualization framework the runtime links against. The pinned Swift
# toolchain matches the Swift 6.4 that Xcode 27 ships.

min_version = "2026.8.0"

[tools]
# Swift toolchain (swift build/test, swift format).
swift = "6.4.0"
# Python for the repository scripts and checks (tomllib needs 3.11+; macOS
# ships 3.9).
python = "3.14.7"
# Integration scripts and release tooling.
jq = "1.8.2"
yq = "4.53.6"
# Script and workflow linters.
shellcheck = "0.11.0"
"github:kjanat/actionlint" = "1.17.0"
zizmor = "1.30.1"
# Apple `container` CLI: builds the guest images (`iso setup`) and serves the
# integration suites. Its service still has to be started once
# (`container system start`).
container = "1.5.0"

[tasks.hygiene]
description = "Whitespace, final newlines, YAML, large files and merge markers in staged files"
run = "python3 scripts/hygiene.py"

[tasks.lint]
description = "swift format lint --strict over every Swift package"
run = "swift format lint --recursive --strict Package.swift Sources tests/swift fuzz/Targets fuzz/Entrypoints iso-sandbox/Package.swift iso-sandbox/Sources iso-sandbox/Tests iso-proxy/Package.swift iso-proxy/Sources iso-proxy/Tests iso-egress/Package.swift iso-egress/Sources iso-egress/Tests scripts/verify-egress-readiness.swift spikes/macos-computer-use-q0/Package.swift spikes/macos-computer-use-q0/Sources experiments/macos-vz-context-probe/Package.swift experiments/macos-vz-context-probe/Sources"

[tasks.build]
description = "Build the Swift host"
run = "swift build --force-resolved-versions"

[tasks.test]
description = "Swift host tests"
run = "swift test --force-resolved-versions"

[tasks.check]
description = "The pre-commit gates, in order"
depends = ["hygiene", "lint", "build"]
run = "swift test --force-resolved-versions"

# Run by the git hook from `mise generate git-pre-commit --write`.
[tasks.pre-commit]
description = "Git pre-commit hook: hygiene, lint, build, test"
depends = ["check"]

[tasks.check-runtime]
description = "Apple runtime build and unit tests"
run = "swift test --package-path iso-sandbox --force-resolved-versions --no-parallel"

[tasks.check-proxy]
description = "Credential proxy build, unit tests, and offline process gates"
run = """
ulimit -n 8192
swift build --package-path iso-proxy --force-resolved-versions
proxy_bin_dir="$(swift build --package-path iso-proxy --show-bin-path)"
ISO_PROXY_E2E_BINARY="$proxy_bin_dir/iso-proxy" swift test --package-path iso-proxy --force-resolved-versions
"""

[tasks.check-egress]
description = "Filtered egress tests, confinement, lease, and mutation gates"
run = """
swift test --package-path iso-egress --force-resolved-versions
swift build --package-path iso-egress --force-resolved-versions
python3 scripts/test-swift-egress-jail.py
python3 scripts/test-swift-egress-lease.py
python3 scripts/test-swift-egress-mutations.py
"""

[tasks.check-all]
description = "Local checks for all four packages; VM integration is a separate gate"
depends = ["check", "check-runtime", "check-proxy", "check-egress"]
